version: '3.9'

services:
  postgresql:
    image: postgres:15-alpine
    container_name: dylanwave_postgres
    environment:
      POSTGRES_USER: dylanwave
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dylanwave_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dylanwave"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dylanwave_network

  redis:
    image: redis:7-alpine
    container_name: dylanwave_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dylanwave_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dylanwave_backend
    environment:
      DATABASE_URL: postgresql://dylanwave:password@postgresql:5432/dylanwave_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-in-production
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - dylanwave_network

volumes:
  postgres_data:
  redis_data:

networks:
  dylanwave_network:
    driver: bridge
